<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市場籌碼定位 V1</title>
  <style>
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d;
      --text: #c9d1d9; --muted: #8b949e; --green: #3fb950;
      --red: #f85149; --yellow: #d29922; --blue: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; padding: 12px 16px; }

    /* ── 頂部 ── */
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .topbar h1 { font-size: 1.1rem; color: var(--blue); white-space: nowrap; }
    .topbar .date { font-size: .82rem; color: var(--muted); }
    .topbar .btns { margin-left: auto; display: flex; gap: 6px; }
    .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: .82rem; font-weight: 600; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-sm { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 5px 10px; font-size: .78rem; }
    .btn:hover { opacity: .85; }

    /* ── 今日速覽條 ── */
    .today-bar {
      display: flex; gap: 0; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 12px; overflow: hidden;
    }
    .today-cell {
      flex: 1 1 100px; padding: 8px 14px; border-right: 1px solid var(--border);
      min-width: 90px;
    }
    .today-cell:last-child { border-right: none; }
    .today-cell .tc-label { font-size: .68rem; color: var(--muted); margin-bottom: 3px; }
    .today-cell .tc-val { font-size: .95rem; font-weight: 700; }

    /* ── 表格 ── */
    .tbl-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .tbl-hdr {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .tbl-hdr span { font-size: .82rem; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
    select { background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: .78rem; }
    .tbl-scroll { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: .78rem; min-width: 860px; }
    thead tr { background: #1c2128; }
    th {
      padding: 7px 10px; text-align: right; font-weight: 500;
      color: var(--muted); border-bottom: 1px solid var(--border);
      white-space: nowrap; position: sticky; top: 0; background: #1c2128;
    }
    th:first-child { text-align: left; }
    td { padding: 6px 10px; border-bottom: 1px solid #1c2128; text-align: right; }
    td:first-child { text-align: left; color: var(--muted); white-space: nowrap; }
    tr:hover td { background: #1c2128; }
    tr:nth-child(even) td { background: rgba(28,33,40,.5); }
    tr:nth-child(even):hover td { background: #1c2128; }

    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .neu { color: var(--muted); }
    .bold { font-weight: 700; }

    /* 欄位顏色提示 */
    .col-cash { color: #79c0ff; }
    .col-fut  { color: #d2a679; }
    .col-opt  { color: #a5d6ff; }

    .note { font-size: .7rem; color: #484f58; text-align: center; padding: 8px; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>📊 市場籌碼定位引擎 V1</h1>
  <span class="date" id="update-date">載入中...</span>
  <div class="btns">
    <button class="btn btn-sm" onclick="sendTelegram()">📨 Telegram</button>
    <button class="btn btn-sm" onclick="doBackfill()">🗂️ 補歷史資料</button>
    <button class="btn btn-primary" onclick="doRefresh()">🔄 更新資料</button>
  </div>
</div>

<!-- 今日速覽 -->
<div class="today-bar" id="today-bar">
  <div class="today-cell"><div class="tc-label">外資現貨</div><div class="tc-val neu" id="t-fcash">—</div></div>
  <div class="today-cell"><div class="tc-label">外資期貨淨口</div><div class="tc-val neu" id="t-ffut">—</div></div>
  <div class="today-cell"><div class="tc-label">前五大留倉</div><div class="tc-val neu" id="t-t5">—</div></div>
  <div class="today-cell"><div class="tc-label">選 PCR</div><div class="tc-val neu" id="t-pcr">—</div></div>
  <div class="today-cell"><div class="tc-label">外資選擇權</div><div class="tc-val neu" id="t-fopt">—</div></div>
  <div class="today-cell"><div class="tc-label">韭菜指數</div><div class="tc-val neu" id="t-retail">—</div></div>
  <div class="today-cell"><div class="tc-label">定位狀態</div><div class="tc-val neu" id="t-state">—</div></div>
</div>

<!-- 歷史表格 -->
<div class="tbl-wrap">
  <div class="tbl-hdr">
    <span>📋 歷史記錄</span>
    <select id="hist-days" onchange="loadHistory()">
      <option value="20">20天</option>
      <option value="40" selected>40天</option>
      <option value="60">60天</option>
    </select>
    <span class="note" style="margin-left:auto">藍=現貨法人　橙=期貨　灰=選擇權散戶</span>
  </div>
  <div class="tbl-scroll">
    <table>
      <thead>
        <tr>
          <th style="text-align:left">日期</th>
          <th>成交量</th>
          <th class="col-cash">外資<br><span style="font-weight:400;font-size:.68rem">(現貨億)</span></th>
          <th class="col-cash">投信<br><span style="font-weight:400;font-size:.68rem">(億)</span></th>
          <th class="col-cash">自營<br><span style="font-weight:400;font-size:.68rem">(億)</span></th>
          <th class="col-fut">外資大小<br><span style="font-weight:400;font-size:.68rem">(期貨淨口)</span></th>
          <th class="col-fut">前五大<br><span style="font-weight:400;font-size:.68rem">留倉口</span></th>
          <th class="col-fut">前十大<br><span style="font-weight:400;font-size:.68rem">留倉口</span></th>
          <th>選 PCR</th>
          <th class="col-opt">外(選)<br><span style="font-weight:400;font-size:.68rem">(千元)</span></th>
          <th>韭菜<br><span style="font-weight:400;font-size:.68rem">指數</span></th>
          <th style="color:var(--muted)">未平倉<br><span style="font-weight:400;font-size:.68rem">口數</span></th>
        </tr>
      </thead>
      <tbody id="hist-body">
        <tr><td colspan="12" style="text-align:center;color:var(--muted);padding:20px">載入中...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="note">外資大小負值 = 外資淨空；韭菜指數正值 = 散戶偏多（歷史上散戶多頭往往是反指標）</div>
</div>

<script>
function _cv(v, dec=1, unit='') {
  if (v == null) return '<span class="neu">—</span>';
  const cls = v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';
  const sign = v > 0 ? '+' : '';
  const num = dec === 0 ? Math.round(v).toLocaleString() : v.toFixed(dec);
  return `<span class="${cls} bold">${sign}${num}${unit}</span>`;
}

function _pcr(v) {
  if (v == null) return '<span class="neu">—</span>';
  // TAIFEX 以百分比存 (e.g. 83.6 = 83.6%)，統一轉成比值顯示
  const ratio = v > 2 ? v / 100 : v;
  const color = ratio > 1.1 ? '#f85149' : ratio < 0.85 ? '#3fb950' : '#8b949e';
  return `<span style="color:${color};font-weight:700">${ratio.toFixed(2)}</span>`;
}

function _retail(v) {
  if (v == null) return '<span class="neu">—</span>';
  // 正 = 散戶偏多（偏紅警示）；負 = 散戶偏空（偏綠）
  const color = v > 20 ? '#f85149' : v > 5 ? '#d2a679' : v < -20 ? '#3fb950' : '#8b949e';
  const sign = v > 0 ? '+' : '';
  return `<span style="color:${color};font-weight:700">${sign}${v.toFixed(1)}%</span>`;
}

async function loadHistory() {
  const days = document.getElementById('hist-days').value;
  try {
    const r = await fetch(`/api/positioning/history?days=${days}`);
    const rows = await r.json();
    if (!rows.length) {
      document.getElementById('update-date').textContent = '尚無資料';
      document.getElementById('hist-body').innerHTML =
        '<tr><td colspan="12" style="text-align:center;color:var(--muted);padding:20px">尚無資料，請先點擊「更新資料」或「補歷史資料」</td></tr>';
      return;
    }
    const todayStr = new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Taipei'});
    document.getElementById('hist-body').innerHTML = rows.map(d => {
      const volCell = d.market_volume_bn != null
        ? d.market_volume_bn.toFixed(0)+'億'
        : (d.observation_date === todayStr
            ? '<span style="color:#484f58;font-size:.72rem">盤中</span>'
            : '—');
      return `<tr>
      <td>${d.observation_date}</td>
      <td style="color:var(--muted)">${volCell}</td>
      <td>${_cv(d.foreign_cash_net,  1, '億')}</td>
      <td>${_cv(d.trust_cash_net,    1, '億')}</td>
      <td>${_cv(d.dealer_cash_net,   1, '億')}</td>
      <td style="font-size:.85rem">${_cv(d.foreign_futures_net_oi, 0, '口')}</td>
      <td>${_cv(d.top5_net_oi,  0, '口')}</td>
      <td>${_cv(d.top10_net_oi, 0, '口')}</td>
      <td>${_pcr(d.pcr_oi_all)}</td>
      <td>${_cv(d.foreign_option_net_value, 0, '')}</td>
      <td>${_retail(d.retail_mtx_ratio)}</td>
      <td style="color:var(--muted)">${d.tx_equivalent_total_oi != null ? Math.round(d.tx_equivalent_total_oi).toLocaleString() : '—'}</td>
    </tr>`;}).join('');

    // 更新今日速覽（第一筆 = 最新）
    const latest = rows[0];
    const ffnet = latest.foreign_futures_net_oi;
    document.getElementById('update-date').textContent = `資料日期：${latest.observation_date}`;
    document.getElementById('t-fcash').innerHTML  = _cv(latest.foreign_cash_net, 1, '億');
    document.getElementById('t-ffut').innerHTML   = _cv(ffnet, 0, '口');
    document.getElementById('t-t5').innerHTML     = _cv(latest.top5_net_oi, 0, '口');
    document.getElementById('t-pcr').innerHTML    = _pcr(latest.pcr_oi_all);
    document.getElementById('t-fopt').innerHTML   = _cv(latest.foreign_option_net_value, 0, '千');
    document.getElementById('t-retail').innerHTML = _retail(latest.retail_mtx_ratio);
    // 定位狀態
    const stateMap = {
      BULLISH_CONFIRMATION:'多頭確認',BEARISH_CONFIRMATION:'空頭確認',
      SHORT_COVERING:'空單回補',LONG_LIQUIDATION:'多單退出',
      POSITIONING_NEUTRAL:'中性',BULLISH_DIVERGENCE:'多頭背離',
    };
    const st = latest.positioning_state;
    document.getElementById('t-state').textContent = stateMap[st] || st || '—';
  } catch(e) {
    document.getElementById('update-date').textContent = '載入失敗';
    document.getElementById('hist-body').innerHTML =
      `<tr><td colspan="12" style="text-align:center;color:#f85149;padding:20px">載入失敗：${e.message}，請重新整理頁面或點擊「更新資料」</td></tr>`;
  }
}

async function doRefresh() {
  const btn = event.target;
  btn.textContent = '更新中...';
  btn.disabled = true;
  try {
    await fetch('/api/positioning/refresh', { method: 'POST' });
    await new Promise(r => setTimeout(r, 4000));
    await loadHistory();
  } finally {
    btn.textContent = '🔄 更新資料';
    btn.disabled = false;
  }
}

async function doBackfill() {
  const btn = event.target;
  const days = prompt('補回幾天的歷史資料？（建議 30，TAIFEX 最多支援約 60 天）', '30');
  if (!days) return;
  btn.textContent = '補回填中...';
  btn.disabled = true;
  try {
    await fetch(`/api/positioning/backfill?days=${days}`, { method: 'POST' });
    alert(`已開始背景補回填 ${days} 天，約需 1~3 分鐘，完成後請重新整理頁面。`);
  } catch(e) { alert('失敗: ' + e.message); }
  finally {
    btn.textContent = '🗂️ 補歷史資料';
    btn.disabled = false;
  }
}

async function sendTelegram() {
  try {
    await fetch('/api/positioning/telegram', { method: 'POST' });
    alert('Telegram 報告已發送');
  } catch(e) { alert('發送失敗: ' + e.message); }
}

loadHistory();
</script>
</body>
</html>
