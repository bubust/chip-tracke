<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股產業輪動引擎 V1</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --orange: #db6d28;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .header h1 { font-size: 1rem; font-weight: 600; color: var(--text); flex-shrink: 0; }

  /* ── status bar ── */
  .status-bar {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: .8rem;
    color: var(--muted);
  }
  .status-bar span b { color: var(--text); }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 4px;
    vertical-align: middle;
  }
  .status-dot.running { background: var(--yellow); animation: pulse 1s infinite; }
  .status-dot.ok { background: var(--green); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .header-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: .8rem;
    transition: .15s;
  }
  .btn:hover { background: var(--border); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
  .btn.accent:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ── tabs ── */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 12px 20px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    padding: 8px 16px;
    cursor: pointer;
    font-size: .85rem;
    transition: .15s;
    margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text); }

  /* ── main content ── */
  .content { padding: 16px 20px; }

  /* ── table ── */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th {
    background: var(--surface2);
    color: var(--muted);
    font-weight: 500;
    padding: 8px 10px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--text); }
  th .sort-arrow { font-size: .7rem; margin-left: 3px; opacity: .5; }
  th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tr:hover td { background: rgba(255,255,255,.03); }
  tr.expanded td { background: rgba(88,166,255,.04); }

  /* ── badges ── */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: .75rem;
    font-weight: 600;
  }
  .badge-bull  { background: rgba(63,185,80,.2);  color: var(--green); }
  .badge-bear  { background: rgba(248,81,73,.2);  color: var(--red); }
  .badge-range { background: rgba(210,153,34,.2); color: var(--yellow); }

  .badge-strong  { background: rgba(63,185,80,.15);  color: var(--green); }
  .badge-weak    { background: rgba(248,81,73,.15);  color: var(--red); }
  .badge-stable  { background: rgba(139,148,158,.15); color: var(--muted); }

  .badge-event {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: .72rem;
    font-weight: 600;
  }
  .badge-event-BREAKOUT        { background: rgba(63,185,80,.2);  color: var(--green); }
  .badge-event-BREAKDOWN       { background: rgba(248,81,73,.2);  color: var(--red); }
  .badge-event-FALSE_BREAKDOWN { background: rgba(188,140,255,.2); color: var(--purple); }
  .badge-event-FALSE_BREAKOUT  { background: rgba(210,153,34,.2); color: var(--yellow); }
  .badge-event-RECLAIM         { background: rgba(88,166,255,.2);  color: var(--accent); }

  .rank-num {
    display: inline-block;
    min-width: 28px;
    text-align: center;
    font-weight: 600;
    color: var(--text);
  }
  .rank-top3  { color: var(--green); }
  .rank-bot3  { color: var(--red); }

  .ret-pos { color: var(--green); }
  .ret-neg { color: var(--red); }
  .ret-neu { color: var(--muted); }

  .arrow-up   { color: var(--green); }
  .arrow-down { color: var(--red); }

  /* ── expand row ── */
  .expand-row td { padding: 0; }
  .expand-inner {
    padding: 12px 20px;
    background: var(--surface2);
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .expand-section h4 { font-size: .78rem; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 20px; }
  .detail-item { display: flex; justify-content: space-between; gap: 12px; font-size: .78rem; }
  .detail-label { color: var(--muted); }
  .detail-value { font-weight: 500; }

  /* ── events tab ── */
  .event-list { display: flex; flex-direction: column; gap: 8px; }
  .event-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .event-date { color: var(--muted); font-size: .78rem; flex-shrink: 0; }
  .event-sector { font-weight: 600; min-width: 120px; }
  .event-detail { color: var(--muted); font-size: .8rem; }

  /* ── empty / loading ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .loading { display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 20px 0; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── toast ── */
  .toast {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--text);
    font-size: .85rem;
    z-index: 9999;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.ok { border-color: var(--green); }
  .toast.err { border-color: var(--red); }

  /* ── regime chip ── */
  .regime-chip {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: .72rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .regime-多頭強勢 { background: rgba(63,185,80,.25);  color: #5cf07f; }
  .regime-多頭弱勢 { background: rgba(63,185,80,.12);  color: var(--green); }
  .regime-盤整強勢 { background: rgba(210,153,34,.2);  color: var(--yellow); }
  .regime-盤整弱勢 { background: rgba(139,148,158,.12); color: var(--muted); }
  .regime-空頭抗跌 { background: rgba(248,81,73,.15);  color: #ff8a85; }
  .regime-空頭弱勢 { background: rgba(248,81,73,.25);  color: var(--red); }

  /* ── sector detail page ── */
  .back-btn { color: var(--accent); cursor: pointer; font-size: .85rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px; }
  .back-btn:hover { text-decoration: underline; }
  .detail-header { margin-bottom: 20px; }
  .detail-header h2 { font-size: 1.2rem; }
  .detail-header .meta { color: var(--muted); font-size: .82rem; margin-top: 4px; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .metric-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .metric-label { color: var(--muted); font-size: .75rem; margin-bottom: 4px; }
  .metric-value { font-size: 1.1rem; font-weight: 600; }

  /* ── index chart area ── */
  .chart-area {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: .85rem;
  }

  .health-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .health-bar { height: 6px; border-radius: 3px; background: var(--border); flex: 1; max-width: 80px; overflow: hidden; }
  .health-bar-fill { height: 100%; background: var(--green); transition: width .3s; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🔄 台股產業輪動引擎 V1</h1>
  <div class="status-bar" id="status-bar">
    <span><span class="status-dot" id="status-dot"></span><b id="stat-sectors">—</b> 個產業</span>
    <span>股票 <b id="stat-stocks">—</b> 支</span>
    <span>最後更新 <b id="stat-date">—</b></span>
    <span id="engine-running-txt" style="display:none;color:var(--yellow)">⏳ 計算中...</span>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="triggerInit()" id="btn-init" title="從 FinMind 重新建立產業對照表">初始化</button>
    <button class="btn accent" onclick="triggerRefresh()" id="btn-refresh">🔄 更新計算</button>
  </div>
</div>

<!-- Sort Tabs -->
<div class="tabs">
  <button class="tab-btn active" data-tab="rank" onclick="switchSortTab('rank', this)">當前排名</button>
  <button class="tab-btn" data-tab="change" onclick="switchSortTab('change', this)">排名改善</button>
  <button class="tab-btn" data-tab="event" onclick="switchSortTab('event', this)">結構事件</button>
  <button class="tab-btn" data-tab="events-list" onclick="switchSortTab('events-list', this)">📋 事件記錄</button>
</div>

<!-- Content -->
<div class="content" id="main-content">
  <div class="loading" id="loading-indicator">
    <div class="spinner"></div> 載入中...
  </div>

  <!-- 主表格（rank / change / event tab） -->
  <div id="sectors-panel" style="display:none">
    <div class="tbl-wrap">
      <table id="sectors-table">
        <thead>
          <tr>
            <th onclick="sortTable('sector_name')">產業 <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('trend_state')">趨勢 <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('relative_rank_5d')">5D # <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('relative_rank_20d')">20D # <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('relative_rank_60d')">60D # <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('rank_trend')">排名趨勢 <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('return_ew_5d')">5D % <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('return_ew_20d')">20D % <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('structure_event')">結構事件 <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('internal_health')">健康度 <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('sector_regime')">狀態標籤 <span class="sort-arrow">↕</span></th>
            <th>詳細</th>
          </tr>
        </thead>
        <tbody id="sectors-tbody">
        </tbody>
      </table>
    </div>
  </div>

  <!-- 事件記錄 -->
  <div id="events-panel" style="display:none">
    <div class="event-list" id="events-list-container"></div>
  </div>

  <!-- 產業詳細頁 -->
  <div id="detail-panel" style="display:none">
    <div class="back-btn" onclick="backToList()">← 返回列表</div>
    <div id="detail-content"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
