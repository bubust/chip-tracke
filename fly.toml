app = "qiangni-tactics"
primary_region = "nrt"  # Tokyo, Japan

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[mounts]]
  source = "chip_data"
  destination = "/app/chip_data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
