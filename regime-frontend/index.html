<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股市場 Regime 面板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; padding: 16px; }
  h2 { font-size: 1.1rem; color: #8b949e; margin-bottom: 12px; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #21262d; padding-bottom: 12px; }
  .header h1 { font-size: 1.2rem; color: #e6edf3; }
  .header .date { font-size: .8rem; color: #8b949e; }
  .btn { padding: 6px 16px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; cursor: pointer; font-size: .85rem; }
  .btn:hover { border-color: #58a6ff; color: #58a6ff; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .score-card { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 16px; text-align: center; }
  .score-card .label { font-size: .75rem; color: #8b949e; margin-bottom: 6px; }
  .score-card .value { font-size: 2.2rem; font-weight: 700; }
  .score-card .sub { font-size: .72rem; color: #8b949e; margin-top: 4px; }
  .regime-box { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .regime-label { font-size: 1.3rem; font-weight: 700; text-align: center; padding: 12px; }
  .factors-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .factor-row { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px; }
  .factor-row .name { font-size: .78rem; color: #8b949e; margin-bottom: 4px; }
  .factor-row .bar-wrap { background: #0d1117; border-radius: 4px; height: 8px; overflow: hidden; }
  .factor-row .bar { height: 100%; border-radius: 4px; transition: width .4s; }
  .factor-row .num { font-size: .9rem; font-weight: 600; margin-top: 4px; }
  .green { color: #3fb950; } .red { color: #f85149; } .yellow { color: #d29922; }
  .series-list { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 16px; }
  .series-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #21262d; font-size: .85rem; }
  .series-row:last-child { border-bottom: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-bar { font-size: .75rem; color: #8b949e; text-align: right; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>🇹🇼 台股市場 Regime</h1>
  <span class="date" id="regime-date">—</span>
  <button class="btn" onclick="refresh()">🔄 更新資料</button>
</div>
<div id="status-bar">資料載入中...</div>

<div class="grid3">
  <div class="score-card" id="card-dir">
    <div class="label">Direction</div>
    <div class="value" id="dir-val">—</div>
    <div class="sub">市場方向（-100~+100）</div>
  </div>
  <div class="score-card" id="card-risk">
    <div class="label">Risk Score</div>
    <div class="value" id="risk-val">—</div>
    <div class="sub">市場脆弱度（0~100）</div>
  </div>
  <div class="score-card" id="card-ex">
    <div class="label">Exhaustion</div>
    <div class="value" id="ex-val">—</div>
    <div class="sub">極端竭盡（0~100）</div>
  </div>
</div>

<div class="regime-box">
  <div class="label" style="text-align:center;font-size:.75rem;color:#8b949e;margin-bottom:4px">市場狀態</div>
  <div class="regime-label" id="regime-label">載入中…</div>
</div>

<h2>四大方向因子</h2>
<div class="factors-grid" id="factors-grid">
  <div class="factor-row"><div class="name">載入中...</div></div>
</div>

<h2>即時市場數據</h2>
<div class="series-list" id="series-list">
  <div class="series-row"><span>載入中...</span></div>
</div>

<script>
const SERIES_LABELS = {
  TAIEX: '台股加權', OTC: '上櫃指數', SP500: 'S&P 500',
  SOX: 'SOX 半導體', VIX: 'VIX 恐慌', US10Y: '美債10Y(%)',
  USDTWD: 'USD/TWD', TSM_ADR: 'TSM ADR', NASDAQ: 'Nasdaq',
  MARGIN_BALANCE: '融資餘額(股)', FOREIGN_NET_LOT: '外資現貨(張)',
};

async function api(path) {
  const r = await fetch('/regime' + path);
  return r.json();
}

function colorDir(v) {
  if (v > 30) return '#3fb950';
  if (v < -30) return '#f85149';
  return '#d29922';
}
function colorRisk(v) {
  if (v > 70) return '#f85149';
  if (v > 50) return '#d29922';
  return '#3fb950';
}
function barColor(v, invert = false) {
  const good = invert ? v < 50 : v > 50;
  return good ? '#3fb950' : '#f85149';
}

function renderToday(data) {
  document.getElementById('regime-date').textContent = data.date || '';
  const dir = data.direction ?? 0;
  const risk = data.risk_score ?? 0;
  const ex = data.exhaustion ?? 0;

  const dEl = document.getElementById('dir-val');
  dEl.textContent = (dir >= 0 ? '+' : '') + dir;
  dEl.style.color = colorDir(dir);

  const rEl = document.getElementById('risk-val');
  rEl.textContent = risk;
  rEl.style.color = colorRisk(risk);

  document.getElementById('ex-val').textContent = ex;
  document.getElementById('regime-label').textContent = data.regime_label || '—';

  // Factors
  const factors = [
    { name: 'Trend 趨勢',       key: 'trend',       dir: true },
    { name: 'Breadth 廣度',     key: 'breadth',     dir: true },
    { name: 'Positioning 籌碼', key: 'positioning', dir: true },
    { name: 'Macro 總經',       key: 'macro_factor',dir: true },
    { name: 'Leverage 槓桿風險',key: 'leverage_risk',dir: false },
    { name: 'Concentration 集中', key: 'concentration', dir: false },
    { name: 'Divergence 背離',  key: 'divergence',  dir: false },
  ];

  document.getElementById('factors-grid').innerHTML = factors.map(f => {
    const v = data[f.key] ?? 0;
    const pct = f.dir ? (v + 100) / 2 : v;  // direction: -100~+100 → 0~100
    const col = f.dir ? colorDir(v) : colorRisk(v);
    const display = f.dir ? ((v >= 0 ? '+' : '') + v) : v;
    return `<div class="factor-row">
      <div class="name">${f.name}</div>
      <div class="bar-wrap"><div class="bar" style="width:${Math.min(100,Math.max(0,pct))}%;background:${col}"></div></div>
      <div class="num" style="color:${col}">${display}</div>
    </div>`;
  }).join('');

  document.getElementById('status-bar').textContent = `最後更新：${new Date().toLocaleTimeString('zh-TW')}`;
}

async function loadSeries() {
  const KEYS = ['TAIEX','OTC','SP500','SOX','VIX','US10Y','USDTWD','TSM_ADR','FOREIGN_NET_LOT','MARGIN_BALANCE'];
  const rows = await Promise.all(KEYS.map(k => api(`/api/regime/series/${k}?days=2`)));
  const el = document.getElementById('series-list');
  el.innerHTML = KEYS.map((k, i) => {
    const data = rows[i];
    if (!data || !data.length) return `<div class="series-row"><span>${SERIES_LABELS[k]||k}</span><span class="yellow">—</span></div>`;
    const latest = data[data.length - 1];
    const prev   = data.length > 1 ? data[data.length - 2] : null;
    const chg    = prev ? ((latest.value - prev.value) / prev.value * 100) : null;
    const chgStr = chg != null ? ((chg >= 0 ? '+' : '') + chg.toFixed(2) + '%') : '';
    const col    = chg == null ? '' : (chg >= 0 ? 'green' : 'red');
    return `<div class="series-row">
      <span>${SERIES_LABELS[k]||k}</span>
      <span>${Number(latest.value).toLocaleString()} <span class="${col}">${chgStr}</span></span>
    </div>`;
  }).join('');
}

async function load() {
  try {
    const today = await api('/api/regime/today');
    renderToday(today);
    await loadSeries();
  } catch(e) {
    document.getElementById('status-bar').textContent = '載入失敗：' + e.message;
  }
}

async function refresh() {
  document.getElementById('status-bar').textContent = '更新中...';
  await fetch('/regime/api/regime/refresh', { method: 'POST' });
  setTimeout(load, 3000);
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
