name: b94-fetch15
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: ["research/b94/fetch15.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q httpx pandas
      - run: python research/b94/fetch15.py
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f research/b94/data/twii_15m.csv research/b94/data/twii_60m_twse.csv || true
          git commit -m "chore: B94e 回測資料（加權 15 分 K，證交所每 5 秒指數）" || exit 0
          git pull --rebase origin claude/backtest-redesign-impl-516r4s
          git push origin HEAD:claude/backtest-redesign-impl-516r4s
