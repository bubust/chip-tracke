name: fbd-probe
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: ["scratch_probe/fbd_3481.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q httpx pandas numpy
      - run: python scratch_probe/fbd_3481.py
