name: 全市場策略掃描

on:
  workflow_dispatch:   # 手動觸發（備援用）
  # 2026-10-09 停用每日排程：GitHub 跑掃描時資料庫是空的、每檔都打 Yahoo（現在 GitHub IP 也被擋，07:55 那次失敗 1115），
  # 結果還會蓋掉 Supabase scan_latest；每天 18:00 改由 Fly 正式站自己的排程掃（有完整價格快取＋鉅亨即時 K 棒）

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行全市場掃描
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: bubust/chip-tracke
        run: python scan_job.py
