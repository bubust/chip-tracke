name: b94-fetch
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: ["research/b94/fetch.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q httpx pandas numpy
      - run: python research/b94/fetch.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f research/b94/data/*.csv
          git commit -m "chore: B94 回測資料（加權日 K、60 分 K、台指期日 K）"
          git pull --rebase origin claude/backtest-redesign-impl-516r4s
          git push origin HEAD:claude/backtest-redesign-impl-516r4s
