name: mt-probe
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: ["scratch_probe/mt_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - run: python scratch_probe/mt_probe.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add scratch_probe/mt_out.json
          git commit -m "chore: 暫時資料（融資維持率實測）"
          git pull --rebase origin claude/backtest-redesign-impl-516r4s
          git push origin HEAD:claude/backtest-redesign-impl-516r4s
