name: b85-probe
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: ["scratch_probe/b85_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q httpx
      - run: python scratch_probe/b85_probe.py
      - run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add scratch_probe/snap_TX_now.json && git commit -m "chore: 暫時資料（線上快照）" && git push
