name: b79-probe
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: ["scratch_probe/**", ".github/workflows/b79-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas httpx
      - run: python scratch_probe/b79_probe.py
