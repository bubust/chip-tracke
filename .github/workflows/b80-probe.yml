name: b80-probe
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: ["scratch_probe/*.py", ".github/workflows/b80-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q httpx numpy pandas
      - run: python scratch_probe/b80_probe.py
      - run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add scratch_probe/snap_*.json && git commit -m "chore: 暫時資料（線上完整快照）" && git push
