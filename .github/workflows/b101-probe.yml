name: b101-probe
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: ["scratch_probe/b101_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q httpx
      - run: python scratch_probe/b101_probe.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f scratch_probe/*.json
          git commit -m "chore: 暫時資料（線上快照）" || exit 0
          git pull --rebase origin claude/backtest-redesign-impl-516r4s
          git push origin HEAD:claude/backtest-redesign-impl-516r4s
