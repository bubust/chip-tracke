name: MOPS probe (temporary)
on:
  push:
    branches: [claude/backtest-redesign-impl-516r4s]
    paths: [tools/mops_probe.py, .github/workflows/mops-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install httpx && python tools/mops_probe.py
