name: Keep Alive — chip-tracke.onrender.com

on:
  schedule:
    - cron: '*/14 * * * *'   # 每 14 分鐘 ping 一次，防止 Render 休眠
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping chip-tracker
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://chip-tracke.onrender.com/api/status
