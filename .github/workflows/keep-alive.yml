name: Keep Alive — qiangni-tactics.fly.dev

on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分鐘 ping 一次（主要靠 cron-job.org，這個是備援）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping chip-tracker
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://qiangni-tactics.fly.dev/api/status
